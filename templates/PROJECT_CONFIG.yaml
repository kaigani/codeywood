# Codeywood Project Configuration Template
# Copy this to your project folder and customize

project:
  name: "My Project"
  slug: "my-project"  # Used for file naming
  version: "0.1"
  modality: "animation"  # animation | live-action | hybrid

# Visual Production Settings
visual:
  # Primary model for artistic/hero shots
  primary_model: "seedream"
  primary_endpoint: "fal-ai/bytedance/seedream/v4.5/text-to-image"

  # Secondary model for technical refs (identity sheets)
  technical_model: "nano_banana"
  technical_endpoint: "fal-ai/nano-banana-pro"

  # Default generation settings
  defaults:
    num_inference_steps: 35
    guidance_scale: 4.0
    hero_shot_size:
      width: 1024
      height: 1536
    identity_sheet_size:
      width: 1536
      height: 1536
    style_test_wide:
      width: 1536
      height: 864
    style_test_square:
      width: 1024
      height: 1024

# Locked Style DNA (populated after Phase 1 exploration)
style_dna:
  name: ""  # e.g., "Gothic Western"
  locked: false

  medium_era: ""
  linework_texture: ""
  lighting_rendering: ""
  color_palette: ""

  # Extracted hex palette (8-12 colors)
  hex_palette: []

# Writers Room Configuration
# Set after Head Writer Selection (see skills/writer/writers-room/SKILL.md)
writers_room:
  head_writer: ""        # Persona filename without .yaml (e.g., "mick_caffrey")
  room: []               # List of persona filenames for room members
  room_size: 5           # Target room size (3-6)

# Negative prompts (common across generations)
negative_prompts:
  - "multiple characters"
  - "multiple people"
  - "crowd"
  - "duplicate figures"
  - "photography"
  - "realistic photo"
  - "photorealistic"
  - "blurry"
  - "low quality"
  - "deformed"
  - "extra limbs"
  - "missing limbs"
  - "bad anatomy"

# Characters (populated as hero shots complete)
characters: {}
  # Example:
  # nameless:
  #   name: "Nameless"
  #   hero_shots_locked: true
  #   identity_sheet_locked: true
  #   palette:
  #     - "#0d0d0d"
  #     - "#1a1a1a"

# Paths (relative to project root)
paths:
  story: "STORY"
  character_sheets: "STORY/CHARACTER_SHEETS"
  visual_production: "VISUAL_PRODUCTION"
  style_guide: "VISUAL_PRODUCTION/STYLE_GUIDE"
  character_refs: "VISUAL_PRODUCTION/CHARACTER_REFS"
  location_refs: "VISUAL_PRODUCTION/LOCATION_REFS"
  exports: "EXPORTS"
  hero_shots: "EXPORTS/hero_shots"
  identity_sheets: "EXPORTS/identity_sheets"
  style_tests: "EXPORTS/style_tests"

# =============================================================================
# ASSET MANIFEST
# =============================================================================
# Tracks paths to generated assets. Updated by scripts after successful generation.
# Claude reads this to understand what assets exist and where they are located.
#
# This section is SCRIPT-MANAGED. Do not edit manually unless correcting errors.
# =============================================================================

assets:
  # Identity sheets (8-panel character reference composites)
  identity_sheets: {}
    # Example (populated by fal_generate.py --identity):
    # protagonist: "EXPORTS/identity_sheets/protagonist_identity_nano_banana_20260205.png"

  # Hero shots (3 per character: entrance, action, quiet)
  hero_shots: {}
    # Example (populated by fal_generate.py --hero):
    # protagonist:
    #   entrance: "EXPORTS/hero_shots/protagonist/protagonist_entrance_nano_banana_20260205.png"
    #   action: "EXPORTS/hero_shots/protagonist/protagonist_action_nano_banana_20260205.png"
    #   quiet: "EXPORTS/hero_shots/protagonist/protagonist_quiet_nano_banana_20260205.png"

  # Location reference grids (2x2 composites)
  location_refs: {}
    # Example (populated by fal_generate.py --location):
    # office: "EXPORTS/location_refs/office_ref_nano_banana_20260205.png"

  # Storyboards (3x2 shot grids)
  storyboards: {}
    # Example (populated by fal_generate.py --storyboard):
    # sc01_cold_open: "EXPORTS/storyboards/sc01_cold_open_storyboard_20260205.png"

  # Video production frames (scene-specific)
  frames: {}
    # Example (populated by generate_frames.py):
    # sc02:
    #   shot01: "VISUAL_PRODUCTION/sc02_outputs/frames/sc02_shot01_establishing_20260205.png"
    #   shot02: "VISUAL_PRODUCTION/sc02_outputs/frames/sc02_shot02_climbing_20260205.png"

  # Video clips (scene-specific)
  clips: {}
    # Example (populated by generate_clips.py):
    # sc02:
    #   clip01: "VISUAL_PRODUCTION/sc02_outputs/clips/sc02_clip01_exterior_20260205.mp4"
    #   clip02: "VISUAL_PRODUCTION/sc02_outputs/clips/sc02_clip02_interior_20260205.mp4"

  # Final assemblies (complete scenes)
  assemblies: {}
    # Example (populated by assemble_scene.py):
    # sc02: "VISUAL_PRODUCTION/sc02_outputs/assembly/sc02_naval_infiltration_complete_20260205.mp4"
