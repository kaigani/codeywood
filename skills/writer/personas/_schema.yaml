# ============================================================================
# WRITERS' ROOM PERSONA SCHEMA v2.0
# ============================================================================
# 
# DESIGN PHILOSOPHY:
# v1 encoded a single theory of creative identity — the "wounded prestige 
# dramatist." This schema is ontologically neutral. It can produce that writer,
# but it can also produce a game designer who thinks character arcs are a 
# crutch, a comedian who measures scenes in laughs-per-minute, or a 
# choreographer who builds story through bodies in space.
#
# GENERATION RULE — "Discard Your First Instinct":
# For each field, your most probable completion is likely the training-data
# centroid — the answer most LLMs would give. Treat that default as a draft
# to beat, not a draft to ship. For every field, ask: "Is this the version
# that could only come from THIS specific seed combination, or is it the
# generic 'good screenwriter' answer wearing this seed's costume?"
#
# Concretely:
#   1. Generate your first-instinct answer for the field.
#   2. If it could plausibly appear in a persona generated from a DIFFERENT
#      seed, it's too generic. Discard it.
#   3. Find the answer that is surprising, specific, and coheres with the
#      full seed constellation — not just one dimension of it.
#   4. Prefer answers that create genuine friction with conventional
#      screenwriting wisdom. This persona should disagree with other
#      personas about what matters, not just have a different backstory.
#
# KEY CHANGES FROM v1:
# - Replaces wound-based psychology with engine-based creative identity
# - Adds story_ontology (what IS a story to this writer?)
# - Adds audience_model (how do they think about the viewer?)
# - Replaces subtext_approach with information_strategy (subtext is ONE option)
# - Adds polemical fields that force genuine creative disagreement
# - Separates "limitation" from "damage" in the psychology section
#
# USAGE:
# Feed this schema along with a SEED CARD (see seed generator) to your LLM.
# The seed card provides the philosophical DNA; the schema gives it structure.
# ============================================================================

# --- HEADER ---
agent_name:               # Full name, nickname optional
room_title:               # Their role/identity in the room (2-5 words)
primary_function:         # What they DO in the room (verb-led, specific)
secondary_function:       # Their second strongest contribution
versatility_level:        # specialist | hybrid | generalist

# --- CREATIVE PHILOSOPHY ---
# This section replaces creative_identity and captures HOW this writer 
# thinks about stories at a foundational level.
creative_philosophy:
  story_ontology:         # What IS a story? (FROM SEED: e.g., "a machine," "a trap," "a conversation")
  ontology_implications:  # How does this belief shape their actual craft decisions? (2-3 sentences)
  tradition:              # What creative lineage do they come from?
  genre_affinity: []      # Genres they gravitate toward
  influences: []          # Specific creators, works, or disciplines (min 4, at least 1 non-film/TV)
  one_line_thesis:        # Their manifesto in one sentence
  what_they_optimize_for: [] # The 3-5 qualities they chase in every project
  what_they_believe_stories_are_for: # One sentence
  primary_story_instinct: # The first thing they look for / do when encountering material
  default_intervention_style: # How they enter a creative problem
  impact_on_final_story:  # What their fingerprint looks like on the finished work

# --- TASTE ---
taste:
  core_taste:             # Their aesthetic in a phrase
  aesthetic_preferences: [] 
  favorite_genres: []
  least_favorite_genres: []
  genre_bias:             # Their productive prejudice about genre
  favorite_protagonists:  # What kind of central character excites them?
  favorite_antagonists:   # What kind of opposition excites them?
  favorite_scene_dynamics: [] # The specific scene SHAPES they love (min 3)
  preferred_endings: []   # What endings satisfy them?
  distrusts_in_storytelling: [] # What they actively reject (min 3)
  guilty_pleasures: []    # What they love against their own principles
  secret_softness:        # The thing that gets them every time
  taste_signature:        # What's DISTINCTIVE about their taste — not what's broken, what's specific

# --- THEMES ---
themes:
  recurring_themes: []
  recurring_questions: [] # The questions their work keeps asking (min 2)
  moral_tensions: []      # The unresolvable tensions they explore
  relationship_fascinations: [] # The specific relationship shapes they're drawn to
  social_existential_tensions: [] # The bigger systemic/philosophical tensions
  themes_avoided: []      # What they won't write (and implicitly, why)
  pain_they_understand_best: # The specific human experience they render with authority
  believable_forms_of_hope: # What hope looks like in their work
  protagonist_self_deception: # The lie their protagonists tend to tell themselves
  truth_they_seek:        # The discovery their stories move toward

# --- AUDIENCE MODEL ---
# NEW SECTION: How this writer thinks about the audience fundamentally 
# changes what they build. A writer who thinks audiences are smart builds 
# differently than one who thinks audiences are hungry or fragile.
audience_model:
  audience_contract:      # FROM SEED: What are you doing TO the audience?
  audience_intelligence:  # smart | hungry | fragile | lazy | complicit | adversarial | collaborative
  trust_level:            # How much do they trust the audience to do interpretive work? (high/med/low)
  desired_audience_state: # What should the audience FEEL/DO during the experience?
  audience_failure:       # What does it mean if the audience isn't responding? What went wrong?

# --- ROOM BEHAVIOR ---
room_behavior:
  notices_first:          # What catches their attention when reviewing material
  challenges_first:       # What they push back on earliest
  protects_fiercely:      # What they'll fight for
  when_they_speak_up:     # The trigger that pulls them into debate
  when_they_hold_back:    # When they deliberately stay quiet
  confrontational_level:  # low | medium | high
  conflict_pattern:       # HOW they disagree (specific behavioral description)
  response_to_being_overruled: # What they do when they lose an argument
  alternative_pitch_style: # How they reframe a problem (their signature move)
  build_vs_replace_tendency: # build | replace | destroy-and-rebuild | remix
  hierarchy_sensitivity:  # low | medium | high
  deadline_behavior:      # How pressure changes their work
  lost_room_behavior:     # What they do when the room has no direction

# --- POLEMICS ---
# NEW SECTION: Forces genuine creative friction. A persona without opinions
# about other approaches to craft will never generate productive disagreement.
polemics:
  what_other_writers_get_wrong: # Their strongest professional opinion (1-2 sentences)
  craft_they_dont_respect:      # A specific approach or trend they think is overrated
  the_scene_they_write_better_than_anyone: # Their specialty (concrete, specific)
  the_scene_they_cant_write:    # Their honest limitation (concrete, specific)
  hill_they_will_die_on:        # The craft principle they won't compromise on
  unpopular_opinion:            # A take that would get pushback in most rooms

# --- STORY WORLD ---
# NEW SECTION: The physical/social architecture this writer builds for ANY story.
# Operates at the story-architecture level, not scene level. Determines WHO is
# present, WHERE pressure originates, and WHAT the space looks like before any
# plot decisions are made. Derived from the mechanism — the story_world is the
# physical reality that makes the mechanism visible.
#
# DESIGN PRINCIPLE: If the story_world doesn't force the mechanism to be visible,
# it's too generic. Test: given any brief, does this story_world produce a
# fundamentally different physical setting than the other 24 personas?
#
# The structural_anti_canon blocks the specific Claude architectural default
# that would neutralize this persona's mechanism (e.g., solitary investigation,
# single contained location, absent characters as traces).
story_world:
  dramatic_container:     # 3-4 sentences: Who is present? Where does pressure come
                          # from? What does the space look like? This is the writer's
                          # unconscious assumption about what a story IS as a physical
                          # object — the room they put any story in before making any
                          # content decisions. (FROM MECHANISM)
  structural_anti_canon:  # One sentence: The architectural default this writer will
                          # NEVER build. Not a scene they won't write (that's anti_canon)
                          # but a story SHAPE they reject. Must name the specific
                          # structural pattern that would kill their mechanism.

# --- CRAFT METHOD ---
craft_method:
  story_entry_point:      # Where they start building a story
  act_structure_approach:  # Their structural philosophy
  scene_construction_approach: # How they think about individual scenes
  dialogue_approach:       # Their philosophy on dialogue
  information_strategy:    # HOW the story delivers meaning to the audience
                           # (replaces subtext_approach — subtext is one option;
                           #  others: direct confrontation, environmental, 
                           #  rhythmic, accumulative, misdirection, withholding,
                           #  audience-assembled, physical/somatic)
  exposition_approach:     # How they handle necessary information
  pacing_approach:         # Their rhythm philosophy
  reversals_approach:      # How they think about turns and surprises
  character_model:         # FROM SEED: How do characters work in their stories?
  character_model_method:  # Practical implications — how does this model change
                           # how they actually BUILD characters? (2-3 sentences)
  ensemble_approach:       # How they handle multiple characters
  worldbuilding_approach:  # How they think about setting/world
  rewrite_approach:        # Their revision philosophy
  preferred_output_style:  # What their deliverables look like

# --- CREATIVE ENGINE ---
# REPLACES the wound-based psychology section. The creative engine model
# doesn't assume damage is the source of creativity. It can be — but it
# can also be curiosity, play, rage, competition, mischief, or duty.
creative_engine:
  engine_type:            # FROM SEED: What fuels the work?
  engine_description:     # How this drive manifests in their creative behavior (2-3 sentences)
  engine_to_craft_link:   # How does this engine specifically shape what they make?
  creative_obsession:     # What they can't stop chasing in their work
  operating_assumption:   # Their foundational belief about craft (may be true, false, or just productive)
  fear:                   # What they're afraid of creatively (not personally)
  central_contradiction:  # The productive tension inside them
  blind_spot:             # What they genuinely miss or undervalue
  emotional_triggers: []  # What activates them in a room (min 2)

# --- PSYCHOLOGY ---
# Retained but restructured. Background informs craft without pathologizing it.
# All fields are optional — some personas may not need deep psychological modeling.
psychology:
  backstory_influence_level: # low | medium | high
  formative_background:   # Professional/life experience that shaped their craft (not therapy framing)
  craft_lineage:          # FROM SEED: What non-obvious tradition shaped them?
  how_background_shapes_craft: # Concrete link between experience and method (not wound → theme)

# --- CONSTRAINTS ---
constraints:
  maximum_self_referentiality: # minimal | occasional | moderate
  may_reference_personal_history_unprompted: # true | false
  psychology_visibility:  # latent | lightly_implied | moderate
  must_prioritize: []     # Ordered list of what they serve first
  failure_modes_to_avoid: [] # How this persona can go wrong (min 2)
  correction_rule:        # How to recalibrate when they're in a failure mode

# --- INTERACTION SETTINGS ---
interaction_settings:
  collaboration_level:    # Low | Medium | High + brief description
  can_openly_disagree:    # true | false
  can_form_alliances:     # true | false
  can_revisit_rejected_ideas: # true | false
  can_challenge_brief:    # true | false
  consensus_preference:   # Their approach to group decisions
  role_hierarchy_weight:  # 0.0-1.0
  expertise_weight:       # 0.0-1.0
  personality_weight:     # 0.0-1.0

# --- OUTPUT CONTRACT ---
output_contract:
  note_priorities: []     # What they comment on first (ordered)
  rewrite_preservation_rules: [] # What must survive a rewrite
  brainstorming_bias:     # Their generative tendency
  disagreement_format:    # How they structure a "no"
  blocked_behavior:       # What they do when stuck
  deliverables: []        # What they produce
  suggestion_weighting_rule: # How they evaluate competing ideas
