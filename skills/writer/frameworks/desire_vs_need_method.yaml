metadata:
  framework_name: "Desire vs Need Template"
  methodology_name: "Desire vs Need Method"
  methodology_family: "Character-Driven Psychological Drama"
  version: "1.0"
  created_for: "story development"
  suitable_media:
    - "feature film"
    - "tv_pilot"
    - "short_film"
    - "anime"
    - "adult_animation"
  best_lar:
    - "character studies"
    - "high-stakes drama"
    - "psychological thrillers"
    - "coming-of-age stories"
  not_ideal_for:
    - "purely procedural action"
    - "high-concept concept-driven horror"
    - "ensemble-only anthology shorts"
  target_lengths:
    - "90-120 minutes"
    - "30-60 minute episodes"
  core_principle: "Dramatic tension is generated by the friction between a character's external, conscious goal (Desire) and their internal, unconscious psychological requirement (Need)."
  primary_story_unit: "The Character Arc (Internal Transformation)"
  primary_success_metric: "The moment of choice where the character must sacrifice their Desire to achieve their Need."

framework_overview:
  summary: "A methodology focused on the psychological architecture of a protagonist. It posits that a character is trapped by a 'Lie' (a false belief) born from a 'W/Ghost' (a past wound). The plot is the external pressure applied to force the character to choose between their 'Want' (the external goal) and their 'Need' (the internal truth)."
  what_this_framework_helps_create:
    - "Deeply resonant character arcs"
    - "Thematic unity between plot and character"
    - "High-stakes emotional climaxes"
    - "Cohesive internal-external conflict"
  what_it_prioritizes:
    - "Psychological causality"
    - "Internal transformation"
    - "Thematic irony"
  what_it_deemphasizes:
    - "External plot twists that don't affect character growth"
    - "Action for the sake of spectacle"

use_when:
  - "The story feels 'hollow' or 'plot-driven' without emotional weight."
  - "The protagonist's goals feel unearned or disconnected from their personality."
  - "The ending feels unearned or lacks emotional impact."

avoid_when:
  - "Writing pure 'concept' or 'mechanic' driven stories (e.g., a disaster movie where the disaster is the only driver)."
  - "Writing ensemble-driven procedurals where individual growth is secondary to the case/mystery."

core_principles:
  - "The Want is the visible driver of the plot."
  - "The Need is the invisible driver of the theme."
  - "The Lie is the barrier between the Want and the Need."
  - "The Wound is the reason the Lie exists."
  - "The Climax is the moment of choice: Abandon the Want to embrace the Need, or cling to the Want and suffer the consequence."

workflow:
  - step: 1
    name: "The Psychological Foundation"
    goal: "Define the character's internal brokenness."
    instructions:
      - "Identify the Wound (The past trauma)."
      - "Identify the Lie (The false belief created by the wound)."
      - "Identify the Need (The truth required to heal)."
    output: "Character psychological profile."
  - step: 2
    name: "The External Projection"
    goal: "Define the character's outward motivation."
    instructions:
      - "Define the Want (The tangible goal that the character believes will fix their life)."
      - "Define the Mask (How the character presents to the world to protect the Lie)."
    output: "The Logline/Premise."
  - step: 3
    name: "The Conflict Mapping"
    goal: "Align plot beats with the friction between Want and Need."
    instructions:
      - "Map external obstacles that specifically target the Lie."
      - "Identify the 'Point of No Return' where the Want and Need become mutually exclusive."
    output: "Structural Outline."
  - step: 4
    name: "Thematic Validation"
    goal: "Ensure the ending provides a thematic resolution."
    instructions:
      - "Check if the Climax forces a choice."
      - "Check if the resolution of the Want mirrors the resolution of the Need."
    output: "Finalized Story Framework."

story_inputs:
  premise: "<the core idea>"
  logline: "<Protagonist + Want + Obstacle + Stakes>"
  medium: "<e.g., Feature Film>"
  genre: "<e.g., Neo-Noir>"
  tone: "<e.g., Melancholic, Gritty>"
  target_length: "<e.g., 110 pages>"
  audience: "<e.g., Adult, Mature>"
  rating: "<e.g., R>"
  production_constraints: []
  creative_constraints: []
  reference_points: []
  must_include: []
  must_avoid: []

methodology_structure:
  act_1_the_false_equilibrium:
    purpose: "Establish the Lie and the pursuit of the Want."
    psychological_state: "Defensive/Static"
    conflict_type: "Internal/Latent"
    thematic_weight: "Foundational"
    external_pressure_level: "Low"
    beats:
      - name: "The Status Quo (The Lie in Action)"
        description: "<How the character's false belief allows them to function, albeit imperfectly.>"
        visual_anchor: "<An image representing the character's 'Mask'>."
      - name: "The Inciting Incident (The Disruption)"
        description: "<An event that makes the current pursuit of the Want impossible or much more difficult.>"
      - name: "The Refusal/Preparation (Clinging to the Lie)"
        description: "<The character attempts to solve the new problem using only their old, flawed methods (The Want).>"
  act_2_the_pressure_cooker:
    purpose: "Force the friction between Want and Need to escalate."
    psychological_state: "Reactive/Unstable"
    conflict_type: "External/Escalating"
    thematic_weight: "Developmental"
    external_pressure_level: "High"
    beats:
      - name: "The First Threshold (Entering the Arena)"
        description: "<The character commits to the pursuit of the Want, but the cost begins to rise.>"
      - name: "The Midpoint (The Crack in the Mask)"
        description: "<A moment where the character realizes that the Want might not be enough, or that the Lie is failing them.>"
        required_decisions:
          - "<Does the character double down on the Want or start questioning the Lie?>"
      - name: "The Escalation (The Cost of the Want)"
        description: "<External obstacles specifically target the character's psychological vulnerability.>"
      - name: "The All Is Lost (The Death of the Lie)"
        description: "<The character's pursuit of the Want leads to a catastrophic failure or a loss of their 'Mask'>."
  act_3_the_choice:
    purpose: "The final confrontation between the character's two selves."
    psychological_state: "Transformative/Decisive"
    conflict_type: "Internal/Climactic"
    thematic_weight: "Resolution"
    external_pressure_level: "Maximum"
    beats:
      - name: "The Climax (The Great Choice)"
        description: "<The character is presented with a choice: Achieve the Want but remain broken, or abandon the Want to achieve the Need.>"
        visual_function: "<A visual representation of the character's transformation (e.g., shedding a literal or metaphorical armor).>"
      - name: "The Resolution (The New Equilibrium)"
        description: "<The state of the character after the choice is made>."

beats_or_units:
  - id: "beat_01"
    name: "The Status Quo (The Lie in Action)"
    order: 1
    purpose: "Establish the character's baseline and the functionality of their Lie."
    approximate_position: "0-15%"
    writer_prompt: "Show the character using their 'Mask' to navigate a routine situation, demonstrating how the 'Lie' protects them but limits them."
    story_function: "Establishment of character, setting, and the internal flaw."
    visual_function: "Introduction of the 'Mask' through costume, lighting, or specific repetitive gestures."
    emotional_function: "Establishment of a false sense of stability or a simmering, unacknowledged tension."
    required_decisions:
      - "What is the specific, visible behavior of the Mask?"
      - "How does the environment reinforce the character's Lie?"
    fields_to_complete:
      mask_description: ""
      lie_manifestation: ""
    diagnostic_questions:
      - "Is the character's flaw visible in their daily routine?"
      - "Does the audience see the 'cost' of the Lie even if the character doesn't?"
    completion_criteria:
      - "The character's 'Want' is clearly demonstrated."
      - "The 'Lie' is established as a survival mechanism."
    common_failure_modes:
      - "Character is too perfect (no visible flaw)."
      - "The setting is disconnected from the character's psychology."

  - id: "beat_02"
    name: "The Inciting Incident (The Disruption)"
    order: 2
    purpose: "Disrupt the status quo and introduce the primary obstacle to the Want."
    approximate_position: "15%"
    writer_prompt: "Introduce an external event that makes the character's current way of life (the Lie) unsustainable."
    story_function: "Catalyst for the plot; forces the character out of equilibrium."
    visual_function: "A sudden shift in lighting, color palette, or environmental stability."
    emotional_function: "Shock, confusion, or a surge of false hope."
    required_decisions:
      - "How does this event specifically threaten the character's 'Want'?"
      - "How does this event force the 'Lie' to be tested?"
    fields_to_complete:
      event_impact: ""
      threat_to_want: ""
    diagnostic_questions:
      - "Is the incident purely external, or does it touch the Wound?"
      - "Does the character have a choice to ignore it?"
    completion_criteria:
      - "The character's trajectory is irrevocably altered."
    common_failure_modes:
      - "The incident is too random (no psychological connection)."
      - "The incident doesn't actually threaten the 'Want'."

  - id: "beat_03"
    name: "The Refusal/Preparation (Clinging to the Lie)"
    order: 3
    purpose: "Show the character attempting to solve the new problem using their old, flawed methods."
    approximate_position: "15-25%"
    writer_prompt: "The character attempts to use their 'Mask' or 'Lie' to bypass the disruption, only to find it is no longer working."
    story_function: "Demonstrates the inadequacy of the character's current psychological state."
    visual_function: "Increased chaos or the 'Mask' beginning to crack/falter."
    emotional_function: "Frustration, denial, or desperate determination."
    required_decisions:
      - "What specific 'old method' does the character use?"
      - "What is the first sign that the 'Lie' is failing?"
    fields_to_complete:
      failed_tactic: ""
      consequence_of_failure: ""
    diagnostic_questions:
      - "Is the character's resistance to change believable?"
      - "Does the failure of the tactic raise the stakes?"
    completion_criteria:
      - "The character is forced to commit to a new, more dangerous path."
    common_failure_modes:
      - "The character changes too quickly (losing the struggle of the Lie)."
      - "The 'preparation' phase drags without progress."

  - id: "beat_04"
    name: "The First Threshold (Entering the Arena)"
    order: 4
    purpose: "The character commits to the pursuit of the Want, entering a new world or state of being."
    approximate_position: "25%"
    writer_prompt: "The character crosses a point of no return, leaving their old life behind to pursue the 'Want'."
    story_function: "Transition from Act 1 to Act 2; expansion of the world and stakes."
    visual_function: "A change in location or a significant change in the character's physical appearance/equipment."
    emotional_function: "Excitement, fear, or a sense of adventure/dread."
    required_decisions:
      - "What is the 'point of no return'?"
      - "What is the new 'Arena' (the setting/context)?"
    fields_to_complete:
      new_environment: ""
      commitment_level: ""
    diagnostic_questions:
      - "Is the commitment to the 'Want' clear?"
      - "Are the stakes of the new environment established?"
    completion_criteria:
      - "The character is now actively pursuing the 'Want' in a way that cannot be easily undone."
    common_failure_modes:
      - "The threshold is too easy to cross."
      - "The character's motivation for entering the arena is unclear."

  - id: "beat_05"
    name: "The Midpoint (The Crack in the Mask)"
    order: 5
    purpose: "A moment of realization where the character recognizes the inadequacy of the Lie."
    approximate_position: "50%"
    writer_prompt: "A major event occurs that provides a glimpse of the 'Need', making the character realize the 'Want' might not be enough."
    story_function: "The pivot point; shifts the character from reactive to proactive (or deeper reactive)."
    visual_function: "A visual metaphor for the 'Mask' breaking (e.g., a mirror cracking, a literal wound being revealed)."
    emotional_function: "Epiphany, terror, or profound disorientation."
    required_decisions:
      - "Does the character double down on the Want or start questioning the Lie?"
      - "What piece of truth (the Need) is revealed here?"
    fields_to_complete:
      the_revelation: ""
      the_internal_shift: ""
    diagnostic_questions:
      - "Is the revelation tied to the character's 'Wound'?"
      - "Does this moment change the character's strategy?"
    completion_criteria:
      - "The character's internal architecture is fundamentally shaken."
    common_failure_modes:
      - "The epiphany is too intellectual and not emotional."
      - "The character ignores the revelation too easily."

  - id: "beat_06"
    name: "The Escalation (The Cost of the Want)"
    order: 6
    purpose: "External obstacles specifically target the character's psychological vulnerability."
    approximate_position: "50-75%"
    writer_prompt: "The pursuit of the 'Want' begins to demand more than the character is willing to pay, specifically targeting their 'Wound'."
    story_function: "Increasing the pressure; testing the character's resolve."
    visual_function: "Increasingly harsh environments, darker lighting, or more aggressive antagonists."
    emotional_function: "Exhaustion, desperation, or mounting dread."
    required_decisions:
      - "What is the specific cost of the 'Want' in this beat?"
      - "How does the antagonist exploit the 'Lie'?"
    fields_to_complete:
      the_sacrifice: ""
      the_antagonist_move: ""
    diagnostic_questions:
      - "Is the pressure coming from the character's own choices?"
      - "Is the 'Price' of the 'Want' becoming too high?"
    completion_criteria:
      - "The character is pushed to the brink of total collapse."
    common_failure_modes:
      - "The obstacles feel like 'bad luck' rather than consequences of the character's flaw."
      - "The stakes are purely physical and lack psychological weight."

  - id: "beat_07"
    name: "The All Is Lost (The Death of the Lie)"
    order: 7
    purpose: "The character's pursuit of the Want leads to a catastrophic failure or a loss of their 'Mask'."
    approximate_position: "75%"
    writer_prompt: "The character loses everything they thought they needed to protect their 'Lie', leaving them vulnerable to the 'Need'."
    story_function: "The lowest point; the destruction of the old self."
    visual_function: "A visual representation of ruin, emptiness, or the stripping away of identity."
    emotional_function: "Despair, grief, or total vulnerability."
    required_decisions:
      - "What is the specific loss (social, physical, or material)?"
      - "How does this loss force the character to face the 'Need'?"
    fields_to_complete:
      the_catastrophe: ""
      the_state_of_vulnerability: ""
    diagnostic_questions:
      - "Is the loss a direct consequence of the character's 'Want'?"
      - "Is the character now 'naked' (without the protection of the Lie)?"
    completion_criteria:
      - "The character has no choice but to confront the 'Need'."
    common_failure_modes:
      - "The loss feels unearned or unearned by the character's actions."
      - "The character is not actually 'lost'; they still have their old defenses."

  - id: "beat_08"
    name: "The Climax (The Great Choice)"
    order: 8
    purpose: "The final confrontation between the character's two selves."
    approximate_position: "85-95%"
    writer_prompt: "The character is presented with a choice: Achieve the Want but remain broken, or abandon the Want to achieve the Need."
    story_function: "The ultimate resolution of the internal and external conflicts."
    visual_function: "A visual representation of the character's transformation (e.g., shedding a literal or metaphorical armor)."
    emotional_function: "Catharsis, triumph, or tragic realization."
    required_decisions:
      - "What is the specific choice being made?"
      - "What is the immediate consequence of this choice?"
    fields_to_complete:
      the_choice: ""
      the_sacrifice: ""
    diagnostic_questions:
      - "Does the choice require a real sacrifice?"
      - "Is the choice a direct result of the character's growth (or failure to grow)?"
    completion_criteria:
      - "The character's internal arc is resolved."
      - "The external plot reaches its conclusion."
    common_failure_modes:
      - "The choice is too easy or doesn't involve a trade-off."
      - "The choice is made by someone else (the character remains passive)."

  - id: "beat_09"
    name: "The Resolution (The New Equilibrium)"
    order: 9
    purpose: "The state of the character after the choice is made."
    approximate_position: "95-100%"
    writer_prompt: "Show the character in a new state of being, demonstrating the integration (or rejection) of the 'Need'."
    story_function: "Thematic wrap-up and demonstration of the new status quo."
    visual_function: "A visual echo of the 'Status Quo' but with a significant, meaningful difference in lighting or composition."
    emotional_function: "Peace, lingering sorrow, or a sense of closure."
    required_decisions:
      - "How has the world changed because of the character's choice?"
      - "What is the final image of the character?"
    fields_to_complete:
      the_new_status_quo: ""
      the_thematic_final_note: ""
    diagnostic_questions:
      - "Does the final image prove the character has changed?"
      - "Is the thematic argument answered?"
    completion_criteria:
      - "The audience understands the final state of the character's soul."
    common_failure_modes:
      - "The resolution is too abrupt."
      - "The resolution fails to show the consequence of the choice."

character_design:
  methodology_role: "Central Driver"
  characters:
    - name: "<Protagonist Name>"
      internal_architecture:
        the_wound: "<The traumatic event or formative experience that shaped them.>"
        the_ghost: "<The lingering memory or presence of the wound.>"
        the_lie: "<The false belief the character uses to protect themselves from the wound.>"
        the_need: "<The truth/growth the character must embrace to be whole.>"
      external_architecture:
        the_want: "<The tangible, external goal they are actively pursuing.>"
        the_mask: "<The persona/behavior used to hide the Lie from others.>"
        the_pursuit: "<The specific actions they take to get what they want.>"
      conflict_dynamics:
        the_friction: "<How pursuing the Want actively prevents the realization of the Need.>"
        the_price: "<What the character must lose (socially, physically, or materially) to achieve the Need.>"
    - name: "<Antagonist Name>"
      methodology_role: "The Mirror or The Obstacle"
      internal_architecture:
        the_shadow_aspect: "<How the antagonist represents the 'unresolved' version of the protagonist's Lie.>"
        the_functional_obstacle: "<How the antagonist's goals directly block the protagonist's Want.>"

world_design:
  methodology_role: "The Pressure Chamber"
  fields:
    the_thematic_environment: "<How the setting/world reinforces the theme of the Need (e.g., a claustrophobic city for a character needing freedom).>"
    the_rules_of_consequence: "<How the world reacts when the character attempts to break their Lie.>"

theme_design:
  methodology_role: "The Truth"
  fields:
    central_argument: "<The debate between the Lie and the Need.>"
    the_thematic_answer: "<The wisdom the story imparts through the character's success or failure.>"

visual_storytelling:
  methodology_role: "Externalizing the Internal"
  image_system:
    the_motif_of_the_lie: "<A recurring visual or object representing the character's false belief.>"
    the_motif_of_the_need: "<A recurring visual or object representing the character's potential growth.>"
  visual_rules:
    - "Use lighting/shadow to represent the Mask vs. the Truth."
  final_image: "<An image that proves the character has (or has not) integrated their Need>."

scene_generation_rules:
  scene_principles:
    - "Every scene should either advance the Want or pressure the Lie."
    - "Conflict should arise from the character's inability to adapt their Lie to new circumstances."
  scene_template:
    scene_id: ""
    beat_or_unit: ""
    location: ""
    characters_instact: ""
    visible_goal: "<What the character is trying to achieve in this scene (The Want).>"
    internal_pressure: "<How the character's Lie or Wound is being triggered here.>"
    the_turn: "<The moment the scene shifts from progress to setback (or vice versa) due to character flaw.>"
    emotional_shift: "<From [Emotion A] to [Emotion B].>"
  do_rules:
    - "Make the external obstacle a direct consequence of the character's internal flaw."
  avoid_rules:
    - "Avoid 'random' obstacles that have no connection to the character's psychology."

revision_passes:
  - name: "The Structure Pass"
    goal: "Ensure the plot beats follow the logical progression of the methodology."
    instructions:
      - "Verify that the transition from Act 1 to Act 2 is triggered by the Inciting Incident."
      - "Check that the Midpoint provides a genuine psychological shift."
    questions:
      - "Does the plot move from the 'Want' to the 'Need'?"
      - "Is the 'All Is Lost' moment a consequence of the character's choices?"
    success_criteria:
      - "The structural arc follows"