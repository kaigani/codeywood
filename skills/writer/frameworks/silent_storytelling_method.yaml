  audience: "<write here>"
  rating: "<write here>"
  production_constraints: []
  creative_lag: []
  reference_points: []
  must_include: []
  must_avoid: []

methodology_structure:
  visual_setup:
    focus: "Establishing the baseline"
    visual_priority: "Lighting and color"
    auditory_priority: "Ambient texture"
    character_priority: "Static presence"
    environmental_priority: "Decay/Order level"
  environmental_clue:
    focus: "Introducing narrative depth"
    visual_priority: "Close-up detail"
    auditory_priority: "Tactile sound"
    character_priority: "Interaction with objects"
    environmental_priority: "Hidden history"
  physical_disturbance:
    focus: "Breaking the equilibrium"
    visual_priority: "Movement and contrast"
    auditory_priority: "Sudden diegetic sound"
    character_priority: "Reactionary movement"
    environmental_priority: "Physical change"
  visual_climax:
    focus: "Resolution of conflict"
    visual_priority: "High-motion/Rapid cutting"
    auditory_priority: "Intense/Impactful sound"
    character_priority: "Physical transformation/Cost"
    environmental_priority: "Destruction/Alteration"
  afterimage:
    focus: "Thematic echo"
    visual_priority: "Static/Lingering shot"
    auditory_priority: "Fading/Dying sound"
    character_priority: "Post-conflict state"
    environmental_priority: "Final state of world"

beats_or_units:
  - id: "setup_image"
    name: "The Establishing Image"
    order: 1
    purpose: "To set the tone, time, and physical state of the world."
    approximate_position: "Opening"
    writer_prompt: "What is the first thing the audience sees that tells them 'this is how the world works'?"
    story_function: "Worldbuilding & Tone"
    visual_function: "Establishing shot, color palette, lighting mood"
    emotional_function: "Atmospheric immersion"
    required_decisions:
      - "Lighting temperature"
      - "Level of environmental decay/order"
    fields_to_complete:
      primary_visual_motif: "<write here>"
      environmental_state: "<write_here>"
    diagnostic_questions:
      - "Does this image communicate the genre without text?"
    completion_criteria:
      - "The setting's mood is unmistakable."
    common_failure_modes:
      - "Too much generic detail that fails to convey specific narrative stakes."

  - id: "inciting_visual"
    name: "The Inciting Disturbance"
    order: 2
    purpose: "To break the established visual equilibrium."
    approximate_position: "Early"
    writer_prompt: "What physical object, movement, or sound disrupts the established stillness?"
    story_function: "Inciting Incident"
    visual_function: "Introduction of movement, change in lighting, or introduction of a new element"
    emotional_function: "Curiosity or Dread"
    required_decisions:
      - "Nature of the disruption (Internal vs External)"
    fields_to_complete:
      the_disruption: "<write here>"
      visual_contrast: "<write here>"
    diagnostic_questions:
      - "Is the disruption purely visual/auditory, or does it rely on an unstated thought?"
    completion_criteria:
      - "The status quo is visibly altered."
    common_failure_modes:
      - "The disruption is too subtle to be noticed without dialogue explanation."

  - id: "clue_reveal"
    name: "The Environmental Reveal"
    order: 3
    purpose: "To provide backstory or plot depth through objects/surroundings."
    approximate_position: "Mid"
    writer_prompt: "What does the character find or interact with that reveals a secret?"
    story_function: "Rising Action / Information Gain"
    visual_function: "Close-ups, focus shifts, tactile interaction"
    emotional_function: "Discovery, realization, or horror"
    required_decisions:
      - "The 'Object of Significance'"
    fields_to_complete:
      object_description: "<write here>"
      the_revealed_truth: "<write here>"
    diagnostic_questions:
      - "Can the viewer understand the secret just by looking at the object's relationship to the character?"
    completion_criteria:
      - "The audience knows more than the character did, or understands the character's past through an object."
    common_failure_modes:
      - "The object is too abstract to be understood visually."

  - id: "physical_climax"
    name: "The Kinetic Peak"
    order: 4
    purpose: "The resolution of conflict through action or physical transformation."
    approximate_position: "Climax"
    writer_prompt: "How does the physical struggle or movement conclude visually?"
    story_function: "Action/Reaction"
    visual_function: "High-motion, rapid cutting, or extreme slow-motion, lighting shifts"
    emotional_function: "Catharsis, tragedy, or exhaustion"
    required_decisions:
      - "The physical cost of the climax"
    fields_to_complete:
      climax_action: "<write here>"
    diagnostic_questions:
      - "Is the outcome of the conflict visible in the character's physical state (e.g., wounds, exhaustion, debris)?"
    completion_criteria:
      - "The conflict is resolved through a visible change in the physical world or character."
    common_failure_modes:
      - "The climax is too chaotic to follow without a character explaining what happened."

  - id: "afterimage_resolution"
    name: "The Lingering Afterimage"
    order: 5
    purpose: "To leave a lasting emotional imprint and summarize the change."
    approximate_position: "Resolution"
    writer_prompt: "What is the final, unmoving image that remains after the action stops?"
    story_function: "Resolution & Thematic Echo"
    visual_function: "Static shot, lingering focus, fading light"
    emotional_function: "Resonance, contemplation, or emptiness"
    required_decisions:
      - "Final lighting state"
      - "Final character posture"
    fields_to_complete:
      final_visual_state: "<write here>"
      thematic_echo_image: "<write here>"
    diagnostic_questions:
      - "Does this image summarize the journey without needing a 'The End' title card?"
    completion_criteria:
      - "The audience feels the weight of the preceding events."
    common_failure_modes:
      - "The image is too disconnected from the preceding climax."

character_design:
  methodology_role: "Characters are defined by their 'Physical Signature' rather than their 'Backlag'."
  characters:
    - name: "<write here>"
      physical_signature: "<What is their most defining movement or gesture?>"
      visual_history: "<How does their clothing/skin/scars tell their past?>"
      reaction_pattern: "<How do they physically respond to fear/joy/pain?>"
      sensory_presence: "<What sound or texture is associated with them?>"

world_design:
  methodology_role: "The environment is the primary narrator."
  fields:
    environmental_narrative_layers:
      - "Layer 1: The Surface (Current state/weather/lighting)"
      - "Layer 2: The History (Evidence of past inhabitants/events)"
      - "Layer 3: The Subtext (Symbolic significance of the architecture/nature)"
    sensory_palette:
      visual_motifs: []
      auditory_anchors: []
      tactile_textures: []

theme_design:
  methodology_role: "Theme is expressed through visual metaphor and symbolic repetition."
  fields:
    central_visual_metaphor: "<write here>"
    thematic_color_shift: "<How does the color palette change as the theme is realized?>"
    symbolic_repetition: "<What image recurs to reinforce the theme?>"

visual_storytelling:
  methodology_role: "The primary tool of communication."
  image_system:
    composition_rules:
      - "Rule of Thirds for isolation"
      - "Symmetry for order/unnatural"