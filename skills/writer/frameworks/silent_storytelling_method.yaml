metadata:
  framework_name: "Silent Storytelling Framework"
  methodology_name: "Silent Storytelling Method"
  methodology_family: "Visual-Centric Narrative"
  version: "1.0"
  created_for: "story development"
  suitable_media:
    - "short film"
    - "anime"
    - "imaginative animation"
    - "game cinematic"
    - "silent animation"
    - "experimental film"
  best_for:
    - "high-concept visual narratives"
    - "atmospheric horror"
    - "character studies through action"
    - "action-heavy sequences"
  not_ideal_for:
    - "dialogue-driven political dramas"
    - "complex legal procedurals"
    - "exposition-heavy sci-fi"
  target_lengths:
    - "short film"
    - "sequence-based animation"
  core_principle: "Narrative information is conveyed exclusively through visual observation, environmental cues, physical action, and diegetic sound, bypassing verbal exposition."
  primary_story_unite: "The Visual Beat"
  primary_success_metric: "Narrative clarity and emotional resonance in the absence of dialogue."

framework_overview:
  summary: "A methodology designed to strip away the crutch of dialogue, forcing the creator to use the medium's inherent visual and auditory strengths to communicate plot, character, and theme."
  what_this_framework_helps_create:
    - "Visually arresting stories"
    - "Deeply atmospheric worlds"
    - "Strong, physically expressive characters"
    - "Universal narratives (language-independently)"
  what_it_prioritizes:
    - "Environmental storytelling"
    - "Character physicality"
    - "Color theory and lighting"
    - "Soundscape as narrator"
  what_it_deemphasizes:
    - "Verbal exposition"
    - "Dialogue-based character development"
    - "Complex linguistic wordplay"

use_when:
  - "When the emotion of the story is too profound for words."
  - "When the setting itself is a primary character."
  - "When aiming for a universal, language-agnostic audience."
  - "When focusing on high-impact visual or kinetic action."

avoid_when:
  - "When the plot relies on complex, technical, or legal information that cannot be visualized."
  - "When character relationships are defined solely by intellectual debate."

core_principles:
  - "Show, Don't Tell (Extreme): If it can be seen, it must be seen; if it cannot be seen, it does not exist in the narrative."
  - "Object as Information: Every significant prop must carry narrative weight or history."
  - "The Body is the Script: Micro-undulations, posture, and gait are the character's dialogue."
  - "Sound is the Subtext: Use diegetic sounds (sounds within the world) to provide context and tension."

workflow:
  - step: 1
    name: "The Visual Premise"
    goal: "Establish the core conflict through a single, potent image."
    instructions:
      - "Identify the central conflict."
      - "Translate that conflict into a visual metaphor or image."
    output: "The Core Image"
  - step: 2
    name: "Environmental Mapping"
    goal: "Build the 'silent narrator' (the setting)."
    instructions:
      - "Define the history of the space through decay, placement, and clutter."
    output: "Environmental Narrative Layer List"
  - step: 3
    name: "Physical Characterization"
    goal: "Define characters through movement and appearance."
    instructions:
      - "Map out how a character reacts to stress without speaking."
    output: "Character Action Profile"
  - step: 4
    name: "Beat Construction"
    goal: "Sequence the visual information reveals."
    instructions:
      - "Arrange beats so that information is revealed incrementally."
    output: "Visual Beat Sheet"

