  tone: "<e.g., Somber, Fatalistic, Grandiose, Gritty>"
  target_length: "<e.g., 110 pages>"
  audience: "<e.g., Adult, Mature, Prestige Drama seekers>"
rating: "<e.g., R, TV-MA>"
